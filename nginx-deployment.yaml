apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfatah-nginx-deployment
  namespace: alfatah-eks-activity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: alfatah-nginx-service-account
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
